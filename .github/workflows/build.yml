name: Build Linux

on:
  push:
    branches: [ main, feature/** ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev build-essential rpm dpkg-dev libgl1 libegl1 libxkbcommon0

      - name: Test
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          pytest -q

      - name: Set artifact version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.1.0-ci" >> "$GITHUB_ENV"
          fi

      - name: Build DEB
        run: VERSION=${VERSION} ./scripts/build_deb.sh

      - name: Build RPM
        run: VERSION=${VERSION} ./scripts/build_rpm.sh

      - name: Verify artifacts
        run: VERSION=${VERSION} ./scripts/verify_artifacts.sh

      - name: Smoke install DEB
        run: |
          sudo apt-get install -y ./artifacts/pdf-signer-nix_${VERSION}_amd64.deb
          pdf-signer-nix --version
          pdf-signer-nix --self-test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-signer-nix-${{ github.ref_name }}
          path: |
            artifacts/pdf-signer-nix
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/pdf-signer-nix
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/SHA256SUMS.txt
