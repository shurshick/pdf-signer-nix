[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-signer-nix"
version = "0.2.13"
description = "Linux desktop app for PDF signing and visible stamp with CryptoPro CSP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Александр Коваленко", email = "shurshick@bk.ru" }]
dependencies = [
  "PySide6>=6.8.3,<6.9",
  "pypdf>=4.3,<6",
  "pyHanko>=0.26,<0.27",
  "reportlab>=4.2,<5",
  "Pillow>=10,<12"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pyinstaller>=6,<7"
]

[project.scripts]
pdf-signer-nix = "pdf_signer_nix.app:main"

[tool.setuptools.packages.find]
include = ["pdf_signer_nix*"]
